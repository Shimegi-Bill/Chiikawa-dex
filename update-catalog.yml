name: 更新圖鑑

on:
  schedule:
    # 每星期一 香港時間 04:00（UTC 星期日 20:00）
    - cron: '0 20 * * 0'
  workflow_dispatch:        # 想即刻行就去 Actions 分頁手動撳

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓官網
        run: |
          cp catalog.json catalog.prev.json 2>/dev/null || true
          node scrape-chiikawa.mjs \
            --out catalog.json \
            --prev catalog.prev.json \
            --slow 700
          rm -f catalog.prev.json

      - name: 睇下有冇新嘢
        id: diff
        run: |
          if git diff --quiet -- catalog.json; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "官網冇新嘢，唔使 commit"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "count=$(node -e "console.log(require('./catalog.json').length)")" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.diff.outputs.changed == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "圖鑑更新：${{ steps.diff.outputs.count }} 件（$(date -u +%Y-%m-%d)）"
          git push
