name: 更新圖鑑

on:
  schedule:
    # 每兩日 香港時間 04:00（＝ UTC 前一日 20:00）
    # cron 嘅「每兩日」係按每月日數計，所以月尾轉月頭可能會連續兩日行，冇所謂。
    - cron: '0 20 1/2 * *'
  workflow_dispatch:        # 想即刻行就去 Actions 分頁手動撳

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 抓官網（連圖）
        run: |
          cp catalog.json catalog.prev.json 2>/dev/null || true
          node scrape-chiikawa.mjs \
            --out catalog.json \
            --prev catalog.prev.json \
            --country HK \
            --imgw 320 \
            --slow 700
          rm -f catalog.prev.json

      - name: 睇下有冇新嘢
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- catalog.json missing-translations.json img)" ]; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "官網冇新嘢，唔使 commit"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "count=$(node -e "console.log(require('./catalog.json').length)")" >> "$GITHUB_OUTPUT"
            echo "pics=$(ls img 2>/dev/null | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
            echo "miss=$(node -e "try{console.log(require('./missing-translations.json')._未譯詞數)}catch{console.log(0)}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.diff.outputs.changed == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json missing-translations.json img
          git commit -m "圖鑑更新：${{ steps.diff.outputs.count }} 件 · ${{ steps.diff.outputs.pics }} 張相 · ${{ steps.diff.outputs.miss }} 個詞未譯（$(date -u -d '+8 hours' +%Y-%m-%d)）"
          # 抓成個官網要廿幾分鐘，期間你好可能 push 咗嘢上去，
          # 咁 runner 手上嗰份就落後咗，直接 push 會俾 remote 彈返。
          # rebase 一次就接得返 —— 呢個 job 只掂 catalog.json / missing / img，
          # 同你手改嗰啲檔唔會撞。試三次都唔得先當真係 fail。
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push 唔到，等 10 秒再試（第 $i 次）"
            sleep 10
          done
          echo "::error::三次都 push 唔到，可能有 conflict，要自己睇下"
          exit 1
